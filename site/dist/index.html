:16px;border:1px dashed var(--line);border-radius:13px;padding:12px 14px;color:var(--muted);min-height:54px}.feedback.good{color:var(--good);background:#f1fbf6;border-color:#8ed4b7}.feedback.bad{color:var(--bad);background:#fff5f5;border-color:#edacb1}.inputrow{display:flex;gap:9px;margin-top:18px}.inputrow input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}.inputrow input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #315efb17}.lex-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.lex-head input{max-width:170px;border:1px solid var(--line);border-radius:10px;padding:8px}.list{display:grid;gap:8px;max-height:620px;overflow:auto}.word{border:1px solid var(--line);border-radius:13px;padding:11px}.word b,.word em,.word small{display:block}.word em{font-style:normal;color:#31556b;margin-top:3px}.word small{color:var(--muted);margin-top:3px}.word.known{border-color:#9dd8c1;background:#f3fbf7}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matchcol{display:grid;gap:8px}.match button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:left;cursor:pointer}.match button.sel{border-color:var(--blue);background:#edf2ff}.match button.done{opacity:.35;pointer-events:none}.timer{height:11px;border-radius:99px;background:#e9edf4;overflow:hidden;margin:12px 0}.timer i{display:block;height:100%;background:linear-gradient(90deg,#ffca58,#f05f68);transition:width .2s}.game-score{font-size:2.8rem;font-weight:900;margin:10px 0}.prep-progress{display:flex;gap:5px;margin:14px 0}.prep-progress i{height:7px;flex:1;border-radius:99px;background:#e8edf5}.prep-progress i.ok{background:var(--good)}.prep-progress i.bad{background:var(--bad)}@media(max-width:980px){.app{grid-template-columns:1fr;padding:12px}.side{position:relative;top:0;height:auto}.work{grid-template-columns:1fr}.units{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main,.side,.panel,. </style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">ЯПК</div><div><h1>Тренажёр слов</h1><p>Юниты 4–7</p></div></div><div class="units" id="units"></div><button class="prep-hero" id="prepHero"><b>Учить предлоги</b><span>Серии, подсказки и повтор ошибок</span></button><div class="stats"><div class="stat"><b id="known">0</b><span>терминов изучено</span></div><div class="stat"><b id="score">0</b><span>верных ответов</span></div></div></aside><main class="main"><div class="head"><div><h2 id="title"></h2><p id="desc"></p></div><button class="reset" id="reset">Сбросить прогресс</button></div><nav class="modes" id="modes"></nav><div class="work"><section class="panel" id="panel"></section><section class="lexicon"><div class="lex-head"><b id="lexTitle"></b><input id="search" placeholder="Найти слово"></div><div class="list" id="list"></div></section></div></main></div><script src="data.js"></script><script src="all-extra.js"></script><script>
const modes=[["cards","Карточки"],["quiz","Квиз"],["type","Перевод"],["match","Собери пару"],["odd","Лишнее слово"],["lightning","Молния"]],state={unit:"4",mode:"cards",i:0,known:new Set(JSON.parse(localStorage.getItem("ypk2-known")||"[]")),score:+localStorage.getItem("ypk2-score")||0,flip:false,left:null,right:null,prepResults:[],prepQueue:[],timer:null,time:30,gameScore:0};const $=id=>document.getElementById(id),U=()=>units[state.unit],word=()=>U().words[state.i%U().words.length],shuffle=a=>[...a].sort(()=>Math.random()-.5),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-zа-яё0-9 ]/gi," ").replace(/\s+/g," ").trim();
function save(){localStorage.setItem("ypk2-known",JSON.stringify([...state.known]));localStorage.setItem("ypk2-score",state.score)}function learn(en){state.known.add(`${state.unit}:${en}`);state.score++;save();renderUnits();renderStats();renderList($("search").value)}function next(){state.i++;state.flip=false;renderPanel()}function setMode(m){clearInterval(state.timer);state.mode=m;state.i=0;state.prepResults=[];renderModes();renderPanel()}
function renderUnits(){$("units").innerHTML=Object.entries(units).map(([id,u])=>{let k=u.words.filter(w=>state.known.has(`${id}:${w.en}`)).length,p=Math.round(k/u.words.length*100);return `<button class="unit ${id===state.unit?"active":""}" data-u="${id}"><span class="unit-top"><span>Unit ${id}</span><span>${p}%</span></span><small>${u.topic} · ${u.words.length} терминов</small><span class="bar"><i style="width:${p}%"></i></span></button>`}).join("");document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{state.unit=b.dataset.u;state.i=0;renderAll()})}function renderStats(){$("known").textContent=state.known.size;$("score").textContent=state.score}function renderModes(){$("modes").innerHTML=modes.map(([id,t])=>`<button class="mode ${["match","odd","lightning"].includes(id)?"game":""} ${state.mode===id?"active":""}" data-m="${id}">${t}</button>`).join("");document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m))}
function renderList(q=""){let ws=U().words.filter(w=>(w.en+w.ru+w.def).toLowerCase().includes(q.toLowerCase()));$("lexTitle").textContent=`Словарь: ${U().words.length} терминов`;$("list").innerHTML=ws.map(w=>`<article class="word ${state.known.has(`${state.unit}:${w.en}`)?"known":""}"><b>${esc(w.en)}</b><em>${esc(w.ru)}</em><small>${esc(w.def)}</small></article>`).join("")}function fb(ok,w){return `<div class="feedback ${ok?"good":"bad"}">${ok?"Верно!":"Пока нет."} <b>${esc(w.en)}</b> — ${esc(w.ru)}<br><small>${esc(w.def)}</small></div>`}
function cards(){let w=word();$("panel").innerHTML=`<div class="eyebrow">Карточка ${state.i%U().words.length+1} из ${U().words.length}</div><div class="prompt">${esc(w.en)}</div>${state.flip?`<p class="definition">${esc(w.def)}</p><span class="translation">${esc(w.ru)}</span>`:'<p class="definition">Сначала объясни термин своими словами на английском, затем открой ответ.</p>'}<div class="actions"><button class="primary" id="flip">${state.flip?"Скрыть ответ":"Показать объяснение и перевод"}</button>${state.flip?'<button class="secondary" id="yes">Знаю</button><button class="secondary danger" id="no">Повторить позже</button>':""}</div>`;$("flip").onclick=()=>{state.flip=!state.flip;cards()};if(state.flip){$("yes").onclick=()=>{learn(w.en);next()};$("no").onclick=next}}
function quiz(){let w=word(),opts=shuffle([w,...shuffle(U().words.filter(x=>x!==w)).slice(0,3)]);$("panel").innerHTML=`<div class="eyebrow">Выбери русский перевод</div><div class="prompt">${esc(w.en)}</div><p class="definition">${esc(w.def)}</p><div class="choices">${opts.map(x=>`<button class="choice" data-a="${esc(x.en)}">${esc(x.ru)}</button>`).join("")}</div><div class="feedback" id="feedback">Английское объяснение помогает запомнить смысл, а не только пару слов.</div>`;document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{let ok=b.dataset.a===w.en;b.classList.add(ok?"correct":"wrong");$("feedback").outerHTML=fb(ok,w);if(ok){learn(w.en);setTimeout(next,650)}})}
function type(){let w=word();$("panel").innerHTML=`<div class="eyebrow">Переведи на английский</div><div class="prompt">${esc(w.ru)}</div><p class="definition">Подсказка: ${esc(w.def)}</p><div class="inputrow"><input id="answer" autocomplete="off" placeholder="English term"><button class="primary" id="check">Проверить</button></div><div class="feedback" id="feedback">Можно не учитывать артикль и знаки препинания.</div><div class="actions"><button class="secondary" id="skip">Следующее</button></div>`;let check=()=>{let a=norm($("answer").value),e=norm(w.en.replace(/^to |^a |^an /,"")),ok=a===e||a===norm(w.en);$("feedback").outerHTML=fb(ok,w);if(ok)learn(w.en)};$("check").onclick=check;$("answer").onkeydown=e=>{if(e.key==="Enter")check()};$("skip").onclick=next;$("answer").focus()}
function match(){let pairs=shuffle(U().words).slice(0,6),right=shuffle(pairs.map((w,i)=>({i,t:w.ru})));$("panel").innerHTML=`<div class="eyebrow">Мини-игра · Собери пару</div><p class="definition">Выбери термин слева и перевод справа.</p><div class="match"><div class="matchcol">${pairs.map((w,i)=>`<button data-l="${i}">${esc(w.en)}</button>`).join("")}</div><div class="matchcol">${right.map(x=>`<button data-r="${x.i}">${esc(x.t)}</button>`).join("")}</div></div><div class="feedback" id="feedback">Найди все 6 пар.</div><div class="actions"><button class="secondary" id="again">Новый набор</button></div>`;let test=()=>{if(state.left===null||state.right===null)return;let ok=state.left===state.right;if(ok){document.querySelector(`[data-l="${state.left}"]`).classList.add("done");document.querySelector(`[data-r="${state.right}"]`).classList.add("done");learn(pairs[state.left].en)}$("feedback").className=`feedback ${ok?"good":"bad"}`;$("feedback").textContent=ok?"Пара найдена!":"Эти элементы не совпадают.";state.left=state.right=null;document.querySelectorAll(".match button").forEach(x=>x.classList.remove("sel"))};document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{state.left=+b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");test()});document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.right=+b.dataset.r;document.querySelectorAll("[data-r]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");test()});$("again").onclick=match}
function odd(){let other=Object.keys(units).filter(x=>x!==state.unit),oid=other[Math.floor(Math.random()*other.length)],odd=units[oid].words[Math.floor(Math.random()*units[oid].words.length)],opts=shuffle([...shuffle(U().words).slice(0,3),odd]);$("panel").innerHTML=`<div class="eyebrow">Мини-игра · Лишнее слово</div><div class="prompt">Какой термин не относится к теме Unit ${state.unit}?</div><div class="choices">${opts.map(x=>`<button class="choice" data-odd="${esc(x.en)}">${esc(x.en)}<small style="display:block;color:#667085">${esc(x.def)}</small></button>`).join("")}</div><div class="feedback" id="feedback">Сравни смысл терминов, а не их написание.</div>`;document.querySelectorAll("[data-odd]").forEach(b=>b.onclick=()=>{let ok=b.dataset.odd===odd.en;b.classList.add(ok?"correct":"wrong");$("feedback").className=`feedback ${ok?"good":"bad"}`;$("feedback").innerHTML=ok?`Верно: <b>${esc(odd.en)}</b> относится к другому юниту.`:`Это слово относится к Unit ${state.unit}.`;if(ok){state.score++;save();renderStats();setTimeout(next,750)}})}
function lightning(start=false){if(start){state.time=30;state.gameScore=0;clearInterval(state.timer);state.timer=setInterval(()=>{state.time--;if($("timebar"))$("timebar").style.width=`${state.time/30*100}%`;if($("time"))$("time").textContent=state.time;if(state.time<=0){clearInterval(state.timer);$("panel").innerHTML=`<div class="eyebrow">Раунд завершён</div><div class="game-score">${state.gameScore}</div><p class="definition">правильных ответов за 30 секунд</p><button class="primary" id="restart">Ещё раунд</button>`;$("restart").onclick=()=>lightning(true)}},1000)}let w=word(),opts=shuffle([w,...shuffle(U().words.filter(x=>x!==w)).slice(0,2)]);$("panel").innerHTML=`<div class="eyebrow">Мини-игра · Молния · <span id="time">${state.time}</span> сек</div><div class="timer"><i id="timebar" style="width:${state.time/30*100}%"></i></div><div class="game-score">${state.gameScore}</div><div class="prompt">${esc(w.ru)}</div><div class="choices">${opts.map(x=>`<button class="choice" data-fast="${esc(x.en)}">${esc(x.en)}</button>`).join("")}</div>`;document.querySelectorAll("[data-fast]").forEach(b=>b.onclick=()=>{if(b.dataset.fast===w.en){state.gameScore++;learn(w.en)}state.i++;lightning(false)})}
function prep(start=false){clearInterval(state.timer);state.mode="prep";renderModes();if(start||!state.prepQueue.length){state.prepQueue=shuffle(U().preps).slice(0,10);state.i=0;state.prepResults=[]}let pair=state.prepQueue[state.i];if(!pair){let ok=state.prepResults.filter(Boolean).length;$("panel").innerHTML=`<div class="eyebrow">Серия завершена</div><div class="game-score">${ok}/10</div><p class="definition">Ошибочные сочетания будут повторены в следующей серии.</p><button class="primary" id="prepAgain">Новая серия</button>`;$("prepAgain").onclick=()=>prep(true);return}let [q,a]=pair,pool=["to","in","on","with","for","at","from","into","about","between","under","by","of","among","within"],opts=shuffle([a,...shuffle(pool.filter(x=>x!==a)).slice(0,3)]);$("panel").innerHTML=`<div class="eyebrow">Учить предлоги · ${state.i+1} из 10</div><div class="prep-progress">${Array.from({length:10},(_,i)=>`<i class="${state.prepResults[i]===true?"ok":state.prepResults[i]===false?"bad":""}"></i>`).join("")}</div><div class="prompt">${esc(q)}</div><div class="choices">${opts.map(x=>`<button class="choice" data-prep="${x}">${x}</button>`).join("")}</div><div class="feedback" id="feedback">Выбери предлог. После ошибки сочетание будет показано целиком.</div>`;document.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{let ok=b.dataset.prep===a;b.classList.add(ok?"correct":"wrong");state.prepResults[state.i]=ok;$("feedback").className=`feedback ${ok?"good":"bad"}`;$("feedback").innerHTML=ok?`Верно: <b>${esc(q.replace("___",a))}</b>`:`Правильно: <b>${esc(q.replace("___",a))}</b>. Проговори сочетание целиком.`;if(ok)state.score++;else state.prepQueue.push(pair);save();renderStats();setTimeout(()=>{state.i++;prep(false)},1050)})}
function renderPanel(){clearInterval(state.timer);({cards,quiz,type,match,odd,lightning:()=>lightning(true),prep:()=>prep(false)})[state.mode]()}function renderAll(){$("title").textContent=`Unit ${state.unit}: ${U().topic}`;$("desc").textContent=U().desc;renderUnits();renderStats();renderModes();renderList();renderPanel()}$("search").oninput=e=>renderList(e.target.value);$("prepHero").onclick=()=>prep(true);$("reset").onclick=()=>{state.known=new Set;state.score=0;save();renderAll()};renderAll();
